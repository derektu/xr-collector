        </div>
        <div style="width: 1px; height: 20px; background: #2A3550;"></div>
        <div style="font-size: 13px; color: #97A5BA;">回溯</div>
        <div style="display: flex; align-items: center; gap: 4px; padding: 4px 10px; background: #232E48; border: 1px solid #2A3550; border-radius: 4px; cursor: pointer;">

        </div>
        <div style="flex: 1;"></div>
        <div style="padding: 6px 14px; background: #232E48; border: 1px solid #2A3550; border-radius: 6px; font-size: 13px; color: #FFFFFF; white-space: nowrap;">立即抓取全部</div>
      </div>

      <!-- Channel list -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: -12px;">
        <div style="font-size: 14px; font-weight: 500;">已訂閱頻道</div>
        <div style="font-size: 12px; color: #788BA1;">上次抓取：3 新增 · 7 略過 · 0 失敗</div>
