<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding — Vault 位置選擇 — XR Collector Wireframe</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: #0a0f1a;
    display: flex;
    justify-content: center;
    padding: 32px;
  }
  @media (prefers-color-scheme: light) {
    body { background: #d8dfe8; }
  }
</style>
</head>
<body>
<div style="width: 800px; height: 520px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #141B2C; color: #FFFFFF; padding: 48px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 40px;">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6BA6DF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"></path></svg>
    <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.5px;">XR Collector</div>
  </div>

  <div style="width: 520px; display: flex; flex-direction: column; gap: 20px;">
    <div style="background: #1C2438; border: 1px solid #2A3550; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 13px; font-weight: 500; color: #97A5BA; text-transform: uppercase; letter-spacing: 0.5px;">設定知識庫的儲存目錄</div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1; background: #232E48; border: 1px solid #2A3550; border-radius: 6px; padding: 10px 14px; font-size: 14px; color: #97A5BA; font-family: ui-monospace, 'SF Mono', Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">~/Documents/XR Collector</div>
        <div style="padding: 8px 16px; background: #232E48; border: 1px solid #2A3550; border-radius: 6px; font-size: 14px; color: #FFFFFF; cursor: pointer; white-space: nowrap;">選擇目錄</div>
      </div>
      <div style="font-size: 11px; color: #788BA1; line-height: 1.5; opacity: 0.7;">可選擇雲端硬碟的同步目錄，資料會隨雲端服務自動備份</div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 12px;">
      <div style="padding: 10px 28px; background: #6BA6DF; color: #0C1322; border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer;">開始使用</div>
    </div>
  </div>

</div>
