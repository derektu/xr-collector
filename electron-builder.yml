appId: com.moneydj.xrcollector
productName: XR Collector
directories:
  output: release
  buildResources: build
files:
  - dist/node/**
  - dist/web/**
  - package.json
  - node_modules/**
asar: true
mac:
  artifactName: XR-Collector-${version}-chinese-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  signIgnore:
    - '/Contents/Resources/bin(?:/|$)'
  extraResources:
    - from: skills
      to: skills
    - from: resources/tray
      to: tray
    - from: resources/bin/mac/yt-dlp
      to: bin/yt-dlp
    - from: resources/bin/mac/deno
      to: bin/deno
    - from: resources/bin/mac/runtime-dependencies.json
      to: bin/runtime-dependencies.json
    - from: resources/bin/mac/meilisearch
      to: bin/meilisearch
    - from: resources/bin/mac/meilisearch-build.json
      to: bin/meilisearch-build.json
    - from: resources/bin/mac/xr-mac-update-helper
      to: bin/xr-mac-update-helper
    - from: .local/package-resources/build-info.json
      to: build-info.json
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: XR-Collector-${version}-chinese-win-${arch}-setup.${ext}
  extraResources:
    - from: skills
      to: skills
    - from: resources/tray
      to: tray
    - from: resources/bin/win
      to: bin
      filter: ['*.exe', 'vcruntime140.dll', 'meilisearch-build.json', 'runtime-dependencies.json', 'yt-dlp/**/*']
    - from: .local/package-resources/build-info.json
      to: build-info.json
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
