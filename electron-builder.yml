appId: com.moneydj.xrcollector
productName: XR Collector
directories:
  output: release
  buildResources: build
files:
  - dist/node/**
  - dist/web/**
  - package.json
  - node_modules/**
asar: true
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  identity: null
  extraResources:
    - from: skills
      to: skills
    - from: resources/tray
      to: tray
    - from: resources/bin/mac/yt-dlp
      to: bin/yt-dlp
    - from: resources/bin/mac/deno
      to: bin/deno
    - from: resources/bin/mac/meilisearch
      to: bin/meilisearch
    - from: resources/bin/mac/meilisearch-build.json
      to: bin/meilisearch-build.json
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: XR-Collector-${version}-win-${arch}-setup.${ext}
  extraResources:
    - from: skills
      to: skills
    - from: resources/tray
      to: tray
    - from: resources/bin/win
      to: bin
      filter: ['*.exe', 'meilisearch-build.json', 'yt-dlp/**/*']
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
