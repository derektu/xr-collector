name: CI

# The pull request gate: unit and integration tests, including the real-engine cases, typecheck and
# build on a Mac, plus the verify skill's own tests when the change touches its scripts. Windows,
# the E2E flows, the startup check and packaging run in nightly.yml. A change to Markdown alone does
# not run the gate; the Agent skill is Markdown that tests read, so it runs the gate like code.
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', 'skills/xr-collector-agent/SKILL.md']
  pull_request:
    branches: [main]
    paths: ['**', '!**/*.md', 'skills/xr-collector-agent/SKILL.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Mac)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The parent commit: the base branch of a pull request's merge commit, or main's previous commit.
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned runtimes for the real-engine tests
        run: npm run download:runtime
      - name: Test, typecheck, and build
        run: npm run verify
      - name: Test the verify skill when its scripts or tests changed
        run: |
          if git diff --quiet HEAD^1 HEAD -- .claude/skills/verify/scripts .claude/skills/verify/tests; then
            echo "The verify skill's scripts and tests are unchanged."
          else
            npm run test:verify-skill
          fi
