name: E2E

# Every registered Web flow on a Mac, and optionally the packaged-App smoke on both delivery targets.
# Runs only when dispatched.
on:
  workflow_dispatch:
    inputs:
      packaged_smoke:
        description: Build and run the packaged-App smoke on Mac ARM64 and Windows x64
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  web-regression:
    name: Web regression
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Prepare pinned search engine
        run: npm run prepare:meilisearch -- --target darwin-arm64 --require-native
      - name: Run every registered Web flow
        run: node .claude/skills/verify/scripts/verify.mjs flows run --web --issue 119 --label ci-web --jobs 3
      - name: Save failed Web evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-regression-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ticket-artifacts/119/ci-web-*/**/results.json
            .local/ticket-artifacts/119/ci-web-*/**/*.png
            .local/ticket-artifacts/119/ci-web-*/**/*server.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  packaged-smoke:
    name: Packaged smoke (${{ matrix.target }})
    if: inputs.packaged_smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            package_command: package:mac
            runtime_platform: mac
            app: release/mac-arm64/XR Collector.app
          - runner: windows-2022
            target: win32-x64
            package_command: package:win
            runtime_platform: win
            app: release/win-unpacked/XR Collector.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare pinned runtimes in the runtime cache
        run: npm run prepare:runtime -- ${{ matrix.runtime_platform }}
      - name: Build unsigned test package
        run: npm run ${{ matrix.package_command }}
      - name: Run packaged-App smoke
        shell: bash
        timeout-minutes: 12
        run: node .claude/skills/verify/scripts/smoke-desktop.mjs --app "${{ matrix.app }}" --evidence ".data/ci/package-smoke"
      - name: Save failed packaged smoke evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-smoke-failure-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .data/ci/package-smoke/results.json
            .data/ci/package-smoke/*.png
            .data/ci/package-smoke/server.log
            .data/ci/package-smoke/*-server.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
