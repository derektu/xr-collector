name: Meilisearch native runtimes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/prepare-meilisearch.mjs
      - src/search/meilisearch-runtime-pins.json
      - src/search/meilisearch-runtime.ts
      - scripts/meilisearch-api-smoke.mjs
      - scripts/physical-host.mjs
      - scripts/runtime-dependencies.mjs
      - scripts/runtime-dependency-pins.json
      - .github/workflows/meilisearch-native.yml
      - package.json
  push:
    paths:
      - scripts/prepare-meilisearch.mjs
      - src/search/meilisearch-runtime-pins.json
      - src/search/meilisearch-runtime.ts
      - scripts/meilisearch-api-smoke.mjs
      - scripts/physical-host.mjs
      - scripts/runtime-dependencies.mjs
      - scripts/runtime-dependency-pins.json
      - .github/workflows/meilisearch-native.yml
      - package.json

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            binary: resources/bin/mac/meilisearch
          - runner: windows-2022
            target: win32-x64
            binary: resources/bin/win/meilisearch.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download pinned runtime
        run: npm run prepare:meilisearch -- --target ${{ matrix.target }} --require-native
      - name: Place the pinned Visual C++ runtime beside Meilisearch
        if: runner.os == 'Windows'
        run: node scripts/prepare-windows-crt.mjs
      - run: node scripts/meilisearch-api-smoke.mjs --binary ${{ matrix.binary }} --require-native
