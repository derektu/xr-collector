name: Search with the real engine

# The real-engine search, export and import cases skip on Linux, which has no pinned Meilisearch, so
# Verify never runs them. This runs them on a Mac when server-side code, their test files or the
# runtime pins change; the window and the Electron shell are outside what they exercise.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - '!src/web/**'
      - '!src/electron/**'
      - tests/search/meilisearch-integration.test.ts
      - tests/search/meilisearch-leftover.test.ts
      - tests/server/agent-access.test.ts
      - tests/vault/vault-transfer.test.ts
      - tests/vault/vault-exchange.test.ts
      - scripts/prepare-runtime.mjs
      - scripts/prepare-meilisearch.mjs
      - scripts/runtime-dependency-pins.json
      - .github/workflows/search-engine.yml
      - package.json
  push:
    branches: [main]
    paths:
      - src/**
      - '!src/web/**'
      - '!src/electron/**'
      - tests/search/meilisearch-integration.test.ts
      - tests/search/meilisearch-leftover.test.ts
      - tests/server/agent-access.test.ts
      - tests/vault/vault-transfer.test.ts
      - tests/vault/vault-exchange.test.ts
      - scripts/prepare-runtime.mjs
      - scripts/prepare-meilisearch.mjs
      - scripts/runtime-dependency-pins.json
      - .github/workflows/search-engine.yml
      - package.json

permissions:
  contents: read

jobs:
  real-engine:
    name: Real-engine cases
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run the real-engine cases
        run: npm run test:meilisearch:mac
